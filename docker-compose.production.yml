version: '3.8'

services:
  illure-prod-db:
    image: postgres:16-alpine
    container_name: illure-production-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-illure_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-illure_prod_db}
    volumes:
      - illure_postgres_production_data:/var/lib/postgresql/data
    networks:
      - illure-prod-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  illure-prod-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: illure-production-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-illure_prod_user}:${POSTGRES_PASSWORD}@illure-prod-db:5432/${POSTGRES_DB:-illure_prod_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@illurefragrance.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Illure Super Admin}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-İLLURÊ FRAGRANCE}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL}
    depends_on:
      illure-prod-db:
        condition: service_healthy
    networks:
      - illure-prod-internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-kp-proxy}"
      - "traefik.http.routers.illure-prod-api.rule=Host(`${PRODUCTION_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.illure-prod-api.entrypoints=websecure"
      - "traefik.http.routers.illure-prod-api.tls=true"
      - "traefik.http.routers.illure-prod-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.illure-prod-api.priority=100"
      - "traefik.http.services.illure-prod-api.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  illure-prod-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: illure-production-web
    restart: unless-stopped
    depends_on:
      - illure-prod-api
    networks:
      - illure-prod-internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-kp-proxy}"
      - "traefik.http.routers.illure-prod-web.rule=Host(`${PRODUCTION_DOMAIN}`)"
      - "traefik.http.routers.illure-prod-web.entrypoints=websecure"
      - "traefik.http.routers.illure-prod-web.tls=true"
      - "traefik.http.routers.illure-prod-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.illure-prod-web.priority=1"
      - "traefik.http.services.illure-prod-web.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  illure-prod-internal:
    driver: bridge
    internal: false
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK:-kp-proxy}

volumes:
  illure_postgres_production_data:
    driver: local
